<text x="48" y="344" font-family="Arial,sans-serif" font-size="62" font-weight="600" letter-spacing="-2" fill="#171717">告诉我你的骑行需求</text><text x="50" y="393" font-family="Arial,sans-serif" font-size="24" fill="#74756f">回答 5 个小问题，找到更适合你的车</text>
<!-- progress -->
<text x="50" y="495" font-family="Arial,sans-serif" font-size="20" font-weight="600" fill="#171717">1 / 5</text><text x="111" y="495" font-family="Arial,sans-serif" font-size="19" fill="#858681">预算</text>
<rect x="48" y="517" width="123" height="8" rx="4" fill="#d7fb35"/><rect x="183" y="517" width="123" height="8" rx="4" fill="#dedfda"/><rect x="318" y="517" width="123" height="8" rx="4" fill="#dedfda"/><rect x="453" y="517" width="123" height="8" rx="4" fill="#dedfda"/><rect x="588" y="517" width="114" height="8" rx="4" fill="#dedfda"/>
<!-- question -->
<text x="48" y="641" font-family="Arial,sans-serif" font-size="34" font-weight="600" fill="#171717">你的购车预算大约是多少？</text><text x="50" y="684" font-family="Arial,sans-serif" font-size="21" fill="#73746e">先选一个大致范围，之后可以再调整。</text>
<!-- option grid -->
<g filter="url(#soft)"><rect x="48" y="738" width="320" height="132" rx="25" fill="#fff"/><rect x="382" y="738" width="320" height="132" rx="25" fill="#fff"/><rect x="48" y="890" width="320" height="132" rx="25" fill="#fff"/><rect x="382" y="890" width="320" height="132" rx="25" fill="#fff"/><rect x="48" y="1042" width="320" height="132" rx="25" fill="#fff"/></g>
<g font-family="Arial,sans-serif" font-size="23" font-weight="500" fill="#171717"><text x="76" y="813">1 万元以内</text><text x="410" y="813">1–1.5 万元</text><text x="76" y="965">1.5–2 万元</text><text x="410" y="965">2 万元以上</text><text x="76" y="1117">还没确定</text></g>
<g fill="none" stroke="#c7c8c1" stroke-width="2.5"><circle cx="336" cy="804" r="16"/><circle cx="670" cy="804" r="16"/><circle cx="336" cy="956" r="16"/><circle cx="670" cy="956" r="16"/><circle cx="336" cy="1108" r="16"/></g>
<text x="50" y="1216" font-family="Arial,sans-serif" font-size="18" fill="#858681">选择最接近你情况的一项即可</text>
