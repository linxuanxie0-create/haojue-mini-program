<circle cx="67" cy="211" r="32" fill="#d7fb35"/><text x="67" y="220" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#171717">豪</text><text x="116" y="207" font-family="Arial,sans-serif" font-size="23" font-weight="600" fill="#171717">豪爵选车</text><text x="116" y="234" font-family="Arial,sans-serif" font-size="18" fill="#858681">按你的需求找车型</text><rect x="560" y="187" width="142" height="48" rx="24" fill="#fff"/><text x="631" y="217" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#575852">重新开始</text>
