<defs><filter id="soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#181916" flood-opacity=".04"/></filter></defs>
<rect width="750" height="1624" fill="#f4f4f2"/>
