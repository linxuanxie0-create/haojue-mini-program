<path d="M0 76h750" stroke="#e7e8e4"/><text x="375" y="128" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" font-weight="600" fill="#171717">帮我选车</text><circle cx="694" cy="112" r="23" fill="#fff"/><path d="M689 102q7 0 7 6 0 4-5 7v3M691 124h1" fill="none" stroke="#333" stroke-width="2.5" stroke-linecap="round"/>
