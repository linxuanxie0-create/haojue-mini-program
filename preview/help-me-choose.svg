<rect x="0" y="1333" width="750" height="291" fill="#f4f4f2"/><path d="M0 1333h750" stroke="#e8e9e5"/><rect x="48" y="1370" width="654" height="92" rx="46" fill="#dedfda"/><text x="375" y="1427" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="600" fill="#898a84">请选择后继续</text><text x="375" y="1500" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#888983">答案仅用于本次选车，不会保存</text><rect x="288" y="1580" width="174" height="7" rx="4" fill="#171717"/>
